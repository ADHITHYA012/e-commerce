<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My E-Commerce Store</h1>
    </header>

    <div class="container">

        <div class="products">
            <div class="product">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Smart Watch</h3>
                <p>₹1999</p>
                <button onclick="addToCart('Smart Watch',1999)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Headphones</h3>
                <p>₹1499</p>
                <button onclick="addToCart('Headphones',1499)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Bluetooth Speaker</h3>
                <p>₹2499</p>
                <button onclick="addToCart('Speaker',2499)">
                    Add to Cart
                </button>
            </div>
        </div>

        <div class="cart">
            <h2>Shopping Cart</h2>
            <ul id="cart-items"></ul>
            <h3>Total: ₹<span id="total">0</span></h3>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>

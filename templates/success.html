```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmation | ShopEasy</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style1.css') }}">
</head>

<body>

<header>
    <a href="/" class="logo">ShopEasy</a>
</header>

<main class="success-container">

    <div class="success-icon">✓</div>

    <h1>Order Confirmation</h1>

    <p>You selected the following product:</p>

    <div class="cart-item">

        <img
            src="{{ url_for('static', filename=product.image) }}"
            alt="{{ product.name }}">

        <div class="cart-item-details">

            <h2>{{ product.name }}</h2>

            <p>Quantity: {{ quantity }}</p>

            <p>
                Total: ₹{{ "{:,.0f}".format(total) }}
            </p>

        </div>

    </div>

    <p class="demo-notice">
        This is a demo order confirmation. No payment has been processed.
    </p>

    <a href="/" class="shop-now">
        Continue Shopping
    </a>

</main>

</body>
</html>
```

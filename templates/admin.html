<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
</head>
<body>

<h1>Admin Panel</h1>

<form method="POST">

    <input
        type="text"
        name="name"
        placeholder="Product Name"
        required>

    <input
        type="number"
        name="price"
        placeholder="Price"
        required>

    <button type="submit">
        Add Product
    </button>

</form>

<hr>

<h2>Products</h2>

<ul>
{% for product in products %}
    <li>
        {{ product['name'] }} - ₹{{ product['price'] }}
    </li>
{% endfor %}
</ul>

</body>
</html>
